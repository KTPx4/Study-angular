<div class="auth-form">
    <div class="auth-header">
        <h2 class="auth-title">Đăng ký tài khoản</h2>
        <p class="auth-subtitle">Tạo tài khoản để bắt đầu mua sắm!</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="form">
        <!-- Phone Field -->
        <div class="form-group">
            <label for="phone" class="form-label">
                <i class="fas fa-phone"></i>
                Số điện thoại
            </label>
            <input type="tel" id="phone" [(ngModel)]="phone" name="phone" class="form-input"
                [class.error]="phone && !validatePhone()" placeholder="Nhập số điện thoại (VD: 0912345678)" required
                autocomplete="tel" />
            <span class="form-hint error" *ngIf="phone && !validatePhone()">
                <i class="fas fa-exclamation-circle"></i>
                Số điện thoại không hợp lệ
            </span>
            <span class="form-hint success" *ngIf="phone && validatePhone()">
                <i class="fas fa-check-circle"></i>
                Số điện thoại hợp lệ
            </span>
        </div>

        <!-- Password Field -->
        <div class="form-group">
            <label for="password" class="form-label">
                <i class="fas fa-lock"></i>
                Mật khẩu
            </label>
            <div class="password-input-wrapper">
                <input [type]="showPassword ? 'text' : 'password'" id="password" [(ngModel)]="password" name="password"
                    class="form-input" [class.error]="password && !validatePassword()"
                    placeholder="Nhập mật khẩu (tối thiểu 6 ký tự)" required autocomplete="new-password" />
                <button type="button" class="password-toggle" (click)="togglePasswordVisibility()" tabindex="-1">
                    <i [class]="showPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
                </button>
            </div>
            <span class="form-hint error" *ngIf="password && !validatePassword()">
                <i class="fas fa-exclamation-circle"></i>
                Mật khẩu phải có ít nhất 6 ký tự
            </span>
        </div>

        <!-- Confirm Password Field -->
        <div class="form-group">
            <label for="confirmPassword" class="form-label">
                <i class="fas fa-lock"></i>
                Xác nhận mật khẩu
            </label>
            <div class="password-input-wrapper">
                <input [type]="showConfirmPassword ? 'text' : 'password'" id="confirmPassword"
                    [(ngModel)]="confirmPassword" name="confirmPassword" class="form-input"
                    [class.error]="confirmPassword && !passwordsMatch()"
                    [class.success]="confirmPassword && passwordsMatch()" placeholder="Nhập lại mật khẩu" required
                    autocomplete="new-password" />
                <button type="button" class="password-toggle" (click)="toggleConfirmPasswordVisibility()" tabindex="-1">
                    <i [class]="showConfirmPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
                </button>
            </div>
            <span class="form-hint error" *ngIf="confirmPassword && !passwordsMatch()">
                <i class="fas fa-exclamation-circle"></i>
                Mật khẩu không khớp
            </span>
            <span class="form-hint success" *ngIf="confirmPassword && passwordsMatch()">
                <i class="fas fa-check-circle"></i>
                Mật khẩu khớp
            </span>
        </div>

        <!-- Terms & Conditions -->
        <div class="form-group">
            <label class="checkbox-label">
                <input type="checkbox" [(ngModel)]="agreeTerms" name="agreeTerms" required />
                <span class="checkbox-custom"></span>
                <span class="checkbox-text">
                    Tôi đồng ý với
                    <a href="#" class="terms-link">Điều khoản dịch vụ</a> và
                    <a href="#" class="terms-link">Chính sách bảo mật</a>
                </span>
            </label>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary btn-submit" [disabled]="!isFormValid() || isLoading">
            <span *ngIf="!isLoading">
                <i class="fas fa-user-plus"></i>
                Đăng ký
            </span>
            <span *ngIf="isLoading" class="loading">
                <i class="fas fa-spinner fa-spin"></i>
                Đang đăng ký...
            </span>
        </button>
    </form>

    <!-- Social Register -->
    <div class="social-login">
        <div class="divider">
            <span>Hoặc đăng ký với</span>
        </div>
        <div class="social-buttons">
            <button type="button" class="btn btn-social btn-google" (click)="registerWithGoogle()">
                <i class="fab fa-google"></i>
                Google
            </button>
            <button type="button" class="btn btn-social btn-facebook" (click)="registerWithFacebook()">
                <i class="fab fa-facebook-f"></i>
                Facebook
            </button>
        </div>
    </div>

    <!-- Login Link -->
    <div class="auth-footer">
        <p>
            Đã có tài khoản?
            <a [routerLink]="['/auth/login']" class="auth-link">Đăng nhập ngay</a>
        </p>
    </div>
</div>
