<div class="auth-form">
    <div class="auth-header">
        <h2 class="auth-title">Đăng nhập</h2>
        <p class="auth-subtitle">Chào mừng bạn quay trở lại!</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="form">
        <!-- Username Field -->
        <div class="form-group">
            <label for="username" class="form-label">
                <i class="fas fa-user"></i>
                Tên đăng nhập
            </label>
            <input type="text" id="username" [(ngModel)]="username" name="username" class="form-input"
                placeholder="Nhập tên đăng nhập" required autocomplete="username" />
        </div>

        <!-- Password Field -->
        <div class="form-group">
            <label for="password" class="form-label">
                <i class="fas fa-lock"></i>
                Mật khẩu
            </label>
            <div class="password-input-wrapper">
                <input [type]="showPassword ? 'text' : 'password'" id="password" [(ngModel)]="password" name="password"
                    class="form-input" placeholder="Nhập mật khẩu" required autocomplete="current-password" />
                <button type="button" class="password-toggle" (click)="togglePasswordVisibility()" tabindex="-1">
                    <i [class]="showPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
                </button>
            </div>
        </div>

        <!-- Remember Me & Forgot Password -->
        <div class="form-options">
            <label class="checkbox-label">
                <input type="checkbox" [(ngModel)]="rememberMe" name="rememberMe" />
                <span class="checkbox-custom"></span>
                <span class="checkbox-text">Ghi nhớ đăng nhập</span>
            </label>
            <a href="#" class="forgot-password">Quên mật khẩu?</a>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary-custom btn-submit" [disabled]="!username || !password || isLoading">
            <span *ngIf="!isLoading">
                <i class="fas fa-sign-in-alt"></i>
                Đăng nhập
            </span>
            <span *ngIf="isLoading" class="loading">
                <i class="fas fa-spinner fa-spin"></i>
                Đang đăng nhập...
            </span>
        </button>
    </form>

    <!-- Social Login -->
    <div class="social-login">
        <div class="divider">
            <span>Hoặc đăng nhập với</span>
        </div>
        <div class="social-buttons">
            <button type="button" class="btn btn-social btn-google" (click)="loginWithGoogle()">
                <i class="fab fa-google"></i>
                Google
            </button>
            <button type="button" class="btn btn-social btn-facebook" (click)="loginWithFacebook()">
                <i class="fab fa-facebook-f"></i>
                Facebook
            </button>
        </div>
    </div>

    <!-- Register Link -->
    <div class="auth-footer">
        <p>
            Chưa có tài khoản?
            <a [routerLink]="['/auth/register']" class="auth-link">Đăng ký ngay</a>
        </p>
    </div>
</div>
